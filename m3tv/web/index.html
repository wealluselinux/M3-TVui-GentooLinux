<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>M3 TV</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <header class="top">
    <div class="hello">
      <p class="label" id="date"></p>
      <h1 id="greeting">Welcome</h1>
    </div>

    <div class="status" aria-label="Status">
      <button class="chip" id="weather" type="button" title="Weather"></button>
      <div class="chip" id="net" role="img" aria-label="Network"></div>
      <div class="clock" id="clock" aria-live="off"></div>
    </div>

    <nav class="actions" aria-label="Launcher actions">
      <button class="icon-btn" id="btn-edit" aria-label="Edit apps" title="Edit apps"></button>
      <button class="icon-btn" id="btn-add" aria-label="Add app" title="Add app"></button>
      <button class="icon-btn" id="btn-settings" aria-label="Settings" title="Settings"></button>
      <button class="icon-btn" id="btn-quit" aria-label="Exit launcher" title="Exit launcher"></button>
    </nav>
  </header>

  <main>
    <section class="now" id="now" hidden>
      <div class="now-text">
        <p class="label">Open now</p>
        <h2 id="now-name"></h2>
        <p class="body" id="now-hint"></p>
      </div>
      <button class="btn filled" id="btn-home">Close and go home</button>
    </section>

    <h2 class="section-title" id="section-title">Apps</h2>
    <div class="grid" id="grid" role="list"></div>
  </main>

  <dialog id="dlg-settings">
    <h2>Settings</h2>
    <p class="label">Theme colour</p>
    <div class="swatches" id="swatches"></div>

    <label class="field">
      <span class="label">Weather location</span>
      <div class="row">
        <input id="wx-query" autocomplete="off" placeholder="City, State (for example Detroit, Michigan)">
        <button class="btn tonal" type="button" id="btn-wx-find">Set</button>
      </div>
    </label>
    <label class="field">
      <span class="label">Temperature</span>
      <select id="units">
        <option value="auto">Automatic</option>
        <option value="f">Fahrenheit</option>
        <option value="c">Celsius</option>
      </select>
    </label>

    <label class="field">
      <span class="label">TV scale (restart the launcher to apply)</span>
      <select id="scale">
        <option value="1">Automatic</option>
        <option value="1.25">125%</option>
        <option value="1.5">150%</option>
        <option value="1.75">175%</option>
        <option value="2">200%</option>
        <option value="2.5">250%</option>
      </select>
    </label>
    <label class="field">
      <span class="label">Sign-ins</span>
      <select id="profile-mode">
        <option value="firefox">Use my Firefox profile (keeps my logins)</option>
        <option value="separate">Keep separate from my Firefox</option>
      </select>
    </label>
    <p class="body" id="browser-info"></p>
    <div class="dialog-actions">
      <button class="btn text" id="btn-reset">Reset apps</button>
      <span class="spacer"></span>
      <button class="btn filled" id="btn-settings-close">Done</button>
    </div>
  </dialog>

  <dialog id="dlg-add">
    <form id="form-add" method="dialog">
      <h2>Add an app</h2>
      <label class="field">
        <span class="label">Name</span>
        <input id="add-name" required maxlength="40" autocomplete="off" placeholder="Crunchyroll">
      </label>
      <label class="field">
        <span class="label">Website</span>
        <input id="add-url" required autocomplete="off" placeholder="www.example.com">
      </label>
      <p class="label">Colour</p>
      <div class="swatches" id="add-swatches"></div>
      <label class="check">
        <input type="checkbox" id="add-tv">
        <span>Ask for the TV version of the site (experimental)</span>
      </label>
      <div class="dialog-actions">
        <button class="btn text" type="button" id="btn-add-cancel">Cancel</button>
        <span class="spacer"></span>
        <button class="btn filled" type="submit">Add</button>
      </div>
    </form>
  </dialog>

  <div class="snack" id="snack" role="status" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
